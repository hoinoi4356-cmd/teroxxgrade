<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат стріму — Twitch</title>
  <!--
    Оверлей чату Twitch для OBS.

    Як користуватися:
      1. Запустіть сервер:  node server.js
      2. В OBS: джерело «Браузер» (Browser), URL:
           http://localhost:3000/chat.html
         Розмір — як завгодно, фон сторінки прозорий.
      3. Налаштування за бажанням (параметри в рядку запиту):
           ?ch=1teroxx     — інший канал (за замовчуванням 1teroxx)
           ?w=400          — ширина панелі чату в пікселях
           ?opacity=0.85   — прозорість панелі (0.3 … 1)
           ?theme=dark     — темна тема (за замовчуванням) | light
           ?border=0       — прибрати рамку і тінь

    Чому не file://: Twitch вкладає чат через iframe і вимагає параметр
    parent = ім'я хосту, з якого відкрита сторінка. Тому сторінка має
    відкриватися по http (localhost:3000 або ваш хостинг).
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      /* Повністю прозорий фон — чат лягає поверх стріму в OBS */
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }

    #panel {
      position: absolute;
      top: 52px;
      right: 12px;
      bottom: 12px;
      width: 400px;               /* керується параметром ?w= */
      border-radius: 12px;
      overflow: hidden;
      background: rgba(24, 24, 27, 0.85);   /* керується параметром ?opacity= */
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* лічильник глядачів над панеллю чату */
    #online {
      position: absolute;
      top: 12px;
      right: 12px;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 14px;
      border-radius: 8px;
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
      color: #adadb8;
      font-size: 13px;
      font-weight: 600;
    }
    #online .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #00e5a0;
    }
    #online .dot.off { background: #ff5c5c; }
    #online b { color: #fff; }

    #panel iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Підказка, якщо Twitch не відповідає (немає сервера / бій каналу) */
    #hint {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: #ddd;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="online"><span class="dot" id="online-dot"></span><b id="online-num">…</b> глядачів</div>
  <div id="panel">
    <iframe id="chat" title="Twitch chat"></iframe>
  </div>
  <div id="hint"></div>

  <script>
    (function () {
      var q = new URLSearchParams(location.search);

      var channel = (q.get('ch') || '1teroxx').toLowerCase().replace(/[^a-z0-9_]/g, '');
      var width   = Math.min(800, Math.max(220, parseInt(q.get('w'), 10) || 400));
      var opacity = Math.min(1, Math.max(0.3, parseFloat(q.get('opacity')) || 0.85));
      var theme   = q.get('theme') === 'light' ? 'light' : 'dark';
      var border  = q.get('border') !== '0';

      var panel = document.getElementById('panel');
      panel.style.width = width + 'px';
      if (theme === 'light') {
        panel.style.background = 'rgba(255, 255, 255, ' + opacity + ')';
      } else {
        panel.style.background = 'rgba(24, 24, 27, ' + opacity + ')';
      }
      if (!border) {
        panel.style.border = 'none';
        panel.style.boxShadow = 'none';
      }

      /* лічильник глядачів: ?online=0 вимикає */
      if (q.get('online') === '0') {
        document.getElementById('online').style.display = 'none';
        panel.style.top = '12px';
      } else {
        var oNum = document.getElementById('online-num');
        var oDot = document.getElementById('online-dot');
        var oTick = function () {
          fetch('/api/viewers?ch=' + encodeURIComponent(channel))
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (!d || !d.ok) { oNum.textContent = '—'; oDot.className = 'dot off'; return; }
              if (!d.live) { oNum.textContent = 'не в ефірі'; oDot.className = 'dot off'; return; }
              oNum.textContent = d.viewers;
              oDot.className = 'dot';
            })
            .catch(function () { oNum.textContent = '—'; oDot.className = 'dot off'; });
        };
        oTick();
        setInterval(oTick, 8000);
      }

      /* Twitch вимагає parent = хост, з якого відкрита ця сторінка */
      var parent = location.hostname || 'localhost';
      var src = 'https://www.twitch.tv/popout/' + channel + '/embed'
              + '?parent=' + encodeURIComponent(parent)
              + '&theme=' + theme;

      var iframe = document.getElementById('chat');
      iframe.src = src;

      /* Якщо за 15 секунд чат не з'явився — показуємо підказку */
      var hint = document.getElementById('hint');
      setTimeout(function () {
        try {
          if (!iframe.contentWindow) throw new Error('no access');
        } catch (e) {
          hint.style.display = 'flex';
          hint.innerHTML = 'Чат не завантажився.<br>'
            + 'Сторінку треба відкривати через <b>node server.js</b><br>'
            + '(http://localhost:3000/chat.html), а не подвійним кліком.<br>'
            + 'Також перевірте, що стрім на каналі <b>' + channel + '</b> існує.';
        }
      }, 15000);
    })();
  </script>
</body>
</html>
